<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500">
<defs><marker id="ahd" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B3122E"/></marker>
<marker id="ahn" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7FB2FF"/></marker></defs>
<rect width="1040" height="500" fill="#FAFAF7"/>
<text x="520" y="40" text-anchor="middle" font-size="20" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#1F3A68">Angin lembah (siang) dan angin gunung (malam)</text>
<rect x="10" y="70" width="500" height="320" fill="#DCEBFA"/><path d="M10,380 L130,180 L180,150 L240,370 L260,385 L280,370 L340,150 L390,180 L510,380 Z" fill="#8DA36A" stroke="#4E6B2E" stroke-width="2"/><circle cx="450" cy="110" r="24" fill="#F4C430"/><line x1="225" y1="330" x2="185" y2="190" stroke="#B3122E" stroke-width="6" marker-end="url(#ahd)"/><line x1="295" y1="330" x2="335" y2="190" stroke="#B3122E" stroke-width="6" marker-end="url(#ahd)"/><text x="260" y="100" text-anchor="middle" font-size="18" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#1F3A68">Siang: angin lembah (anabatik)</text><text x="260" y="418" text-anchor="middle" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#222">Lereng memanaskan udara di dekatnya lebih cepat daripada</text><text x="260" y="438" text-anchor="middle" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#222">udara bebas setinggi itu → udara ringan naik lereng</text>
<rect x="530" y="70" width="500" height="320" fill="#2B3A55"/><path d="M530,380 L650,180 L700,150 L760,370 L780,385 L800,370 L860,150 L910,180 L1030,380 Z" fill="#8DA36A" stroke="#4E6B2E" stroke-width="2"/><circle cx="970" cy="110" r="18" fill="#E8E8E8"/><circle cx="980" cy="104" r="16" fill="#2B3A55"/><line x1="705" y1="190" x2="745" y2="330" stroke="#7FB2FF" stroke-width="6" marker-end="url(#ahn)"/><line x1="855" y1="190" x2="815" y2="330" stroke="#7FB2FF" stroke-width="6" marker-end="url(#ahn)"/><text x="780" y="100" text-anchor="middle" font-size="18" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#F1F4F9">Malam: angin gunung (katabatik)</text><text x="780" y="418" text-anchor="middle" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#222">Lereng mendinginkan udara di dekatnya lebih cepat daripada</text><text x="780" y="438" text-anchor="middle" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#222">udara bebas setinggi itu → udara padat turun lereng</text>
<text x="520" y="480" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#666">Olahan penulis. Kuncinya beda suhu lereng dengan udara bebas pada ketinggian sama, bukan "puncak kena sinar lebih dulu".</text>
</svg>